[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "bipkit"
version = "0.1.0"
description = "Official Python SDK for the Bipkit System One Decision Engine API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Bipware", email = "support@bipware.co.za" },
]
keywords = [
  "bipkit",
  "ai",
  "agents",
  "decision-engine",
  "routing",
  "guardrails",
  "classification",
  "provenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
langchain = [
  "langchain-core>=0.3.0",
]
dpl = [
  "cryptography>=42.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "datamodel-code-generator>=0.26.0",
]

[project.urls]
Homepage = "https://bipkit.io"
Documentation = "https://docs.bipkit.io"
Repository = "https://github.com/bipware-org/bipkit-python"
Issues = "https://github.com/bipware-org/bipkit-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bipkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
